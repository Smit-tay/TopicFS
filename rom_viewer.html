<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UArm Swift Pro — Range of Motion Viewer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #111; color: #ccc; padding: 12px 16px; }
h1 { font-size: 15px; font-weight: 500; color: #eee; margin-bottom: 10px; }
#controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
#controls label { font-size: 13px; color: #aaa; }
input[type=file] { font-size: 13px; color: #ccc; background: #1e1e2e; border: 1px solid #333; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
#stats { font-size: 12px; color: #888; margin-left: auto; }
#canvas-container { width: 100%; height: calc(100vh - 130px); min-height: 400px; border: 1px solid #222; border-radius: 6px; overflow: hidden; position: relative; background: #0a0a12; }
#canvas-container canvas { display: block; width: 100% !important; height: 100% !important; }
#no-data { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #444; font-size: 14px; }
#tooltip {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,0.82); color: #eee;
    font-size: 12px; padding: 8px 10px; border-radius: 5px;
    pointer-events: none; display: none; line-height: 1.7;
    border: 1px solid #333;
}
#legend { display: flex; gap: 18px; padding: 7px 0 4px; font-size: 12px; color: #888; flex-wrap: wrap; }
#legend span { display: flex; align-items: center; gap: 5px; }
#legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
#hint { font-size: 11px; color: #555; padding-top: 4px; }
</style>
</head>
<body>
<h1>UArm Swift Pro — Range of Motion Viewer</h1>
<div id="controls">
  <label>Load CSV: <input type="file" id="file-input" accept=".csv"></label>
  <span id="stats"></span>
</div>
<div id="canvas-container">
  <div id="no-data">Load a rom_results.csv file to visualise the workspace</div>
  <div id="tooltip"></div>
</div>
<div id="legend">
  <span><i style="background:#22c55e"></i> Reached (within tolerance)</span>
  <span><i style="background:#ff2200"></i> Out of reach — plotted at commanded position</span>
  <span><i style="background:#60a5fa"></i> Centre origin</span>
  <span><i style="background:#ffffff;opacity:0.25"></i> Commanded position (ghost)</span>
</div>
<div id="hint">Drag to rotate &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Right-drag to pan &nbsp;·&nbsp; Hover sphere for details</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const container = document.getElementById('canvas-container');
const noData    = document.getElementById('no-data');
const stats     = document.getElementById('stats');
const tooltip   = document.getElementById('tooltip');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x0a0a12, 1);
container.appendChild(renderer.domElement);

function resize() {
    const W = container.clientWidth, H = container.clientHeight;
    renderer.setSize(W, H);
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
}

const camera = new THREE.PerspectiveCamera(45, 1, 1, 5000);
const target  = new THREE.Vector3(180, 80, 0);
let rotX = 0.3, rotY = 0.5;

const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 1.0));

let dataGroup = null;
let hoverMeshes = [];
let rowData = [];

// ── Grid ──────────────────────────────────────────────────────────────────────
function buildGrid(cx, cy, cz) {
    const grid = new THREE.Group();
    const mat  = new THREE.LineBasicMaterial({ color: 0x1a1a3a, transparent: true, opacity: 0.7 });
    const size = 500, step = 50;
    for (let i = -size/2; i <= size/2; i += step) {
        const a = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(cx - size/2, cy, cz + i),
            new THREE.Vector3(cx + size/2, cy, cz + i)
        ]);
        const b = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(cx + i, cy, cz - size/2),
            new THREE.Vector3(cx + i, cy, cz + size/2)
        ]);
        grid.add(new THREE.Line(a, mat));
        grid.add(new THREE.Line(b, mat));
    }
    return grid;
}

// ── Axis lines ─────────────────────────────────────────────────────────────
function buildAxes(cx, cy, cz, len) {
    const axes = new THREE.Group();
    [[0xff4444,[1,0,0]],[0x44ff44,[0,1,0]],[0x4488ff,[0,0,1]]].forEach(([col, dir]) => {
        const mat = new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.4 });
        const pts = [
            new THREE.Vector3(cx, cy, cz),
            new THREE.Vector3(cx + dir[0]*len, cy + dir[1]*len, cz + dir[2]*len)
        ];
        axes.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
    });
    return axes;
}

// ── Label sprite ───────────────────────────────────────────────────────────
function makeLabel(text, color) {
    const c = document.createElement('canvas');
    c.width = 80; c.height = 80;
    const ctx = c.getContext('2d');
    ctx.fillStyle = color;
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 40, 40);
    const tex  = new THREE.CanvasTexture(c);
    const mat  = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
    const s    = new THREE.Sprite(mat);
    s.scale.set(18, 18, 1);
    return s;
}

// ── CSV parse ──────────────────────────────────────────────────────────────
function parseCSV(text) {
    const lines   = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim());
    return lines.slice(1).filter(l => l.trim()).map(l => {
        const vals = l.split(',');
        const obj  = {};
        headers.forEach((h, i) => obj[h] = (vals[i] || '').trim());
        return obj;
    });
}

// ── Scene build ────────────────────────────────────────────────────────────
function buildScene(rows) {
    if (dataGroup) scene.remove(dataGroup);
    dataGroup  = new THREE.Group();
    hoverMeshes = [];
    rowData    = rows;

    scene.add(buildGrid(180, 0, 0));
    scene.add(buildAxes(180, 0, 0, 120));

    const spiralPts = [];
    let reached = 0;

    // Render reached points first, missed last (so missed render on top)
    const sorted = [...rows].sort((a, b) => {
        const am = a.reached !== 'true' ? 1 : 0;
        const bm = b.reached !== 'true' ? 1 : 0;
        return am - bm;
    });

    sorted.forEach(row => {
        const idx    = rows.indexOf(row);
        const missed = row.reached !== 'true';
        if (!missed) reached++;

        // plot_x/y/z: commanded for missed, actual for reached
        // CSV columns: plot_x, plot_y, plot_z (set by rom_test.sh)
        // THREE.js Y = arm Z, THREE.js Z = arm Y (standard robotics → 3D convention)
        const hasPlot = row.plot_x !== undefined;
        const px = parseFloat(hasPlot ? row.plot_x : (missed ? row.cmd_x : row.actual_x));
        const py = parseFloat(hasPlot ? row.plot_z : (missed ? row.cmd_z : row.actual_z));
        const pz = parseFloat(hasPlot ? row.plot_y : (missed ? row.cmd_y : row.actual_y));

        const cx2 = parseFloat(row.cmd_x);
        const cy2 = parseFloat(row.cmd_z);
        const cz2 = parseFloat(row.cmd_y);

        const color  = missed ? 0xff2200 : 0x22c55e;
        const radius = missed ? 10 : 5;

        // Main sphere — MeshBasicMaterial: exact colour, unaffected by lighting
        const geo  = new THREE.SphereGeometry(radius, 16, 16);
        const mat  = new THREE.MeshBasicMaterial({ color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(px, py, pz);
        mesh.renderOrder = missed ? 999 : 0;
        mesh.userData = { idx };
        dataGroup.add(mesh);
        hoverMeshes.push(mesh);

        // Ghost sphere at commanded position (only if different from plot position)
        if (!missed) {
            const cmdGeo = new THREE.SphereGeometry(3, 8, 8);
            const cmdMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 });
            const cmdMesh = new THREE.Mesh(cmdGeo, cmdMat);
            cmdMesh.position.set(cx2, cy2, cz2);
            dataGroup.add(cmdMesh);

            // Thin line: commanded → actual
            const lMat = new THREE.LineBasicMaterial({ color: 0x334466, transparent: true, opacity: 0.35 });
            const lGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(cx2, cy2, cz2),
                new THREE.Vector3(px, py, pz)
            ]);
            dataGroup.add(new THREE.Line(lGeo, lMat));
        } else {
            // Missed: red line from centre (where arm sat) to commanded position
            const lMat = new THREE.LineBasicMaterial({ color: 0xff3300, transparent: true, opacity: 0.7 });
            const lGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(180, 80, 0),
                new THREE.Vector3(px, py, pz)
            ]);
            dataGroup.add(new THREE.Line(lGeo, lMat));
        }

        // Point number label
        const label = makeLabel(row.point, missed ? '#ff6644' : '#88ffaa');
        label.position.set(px, py + radius + 8, pz);
        label.renderOrder = missed ? 1000 : 1;
        dataGroup.add(label);

        spiralPts.push(new THREE.Vector3(px, py, pz));
    });

    // Spiral path
    if (spiralPts.length > 1) {
        const sMat = new THREE.LineBasicMaterial({ color: 0x6366f1, transparent: true, opacity: 0.45 });
        const sGeo = new THREE.BufferGeometry().setFromPoints(spiralPts);
        dataGroup.add(new THREE.Line(sGeo, sMat));
    }

    // Centre origin
    const oGeo  = new THREE.SphereGeometry(6, 16, 16);
    const oMat  = new THREE.MeshBasicMaterial({ color: 0x60a5fa });
    const origin = new THREE.Mesh(oGeo, oMat);
    origin.position.set(180, 80, 0);
    origin.renderOrder = 1;
    dataGroup.add(origin);

    scene.add(dataGroup);

    const missed = rows.length - reached;
    stats.textContent = `${rows.length} points · ${reached} reached · ${missed} missed`;
    noData.style.display = 'none';

    target.set(180, 80, 0);
    rotX = 0.3; rotY = 0.5;
    updateCamera(500);
}

// ── Camera ─────────────────────────────────────────────────────────────────
let camDist = 500;
function updateCamera(dist) {
    if (dist !== undefined) camDist = dist;
    camera.position.x = target.x + camDist * Math.sin(rotY) * Math.cos(rotX);
    camera.position.y = target.y + camDist * Math.sin(rotX);
    camera.position.z = target.z + camDist * Math.cos(rotY) * Math.cos(rotX);
    camera.lookAt(target);
}
updateCamera();

// ── Input ──────────────────────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => buildScene(parseCSV(ev.target.result));
    reader.readAsText(file);
});

// Hover tooltip
const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();
let drag = false, rightDrag = false, lastX = 0, lastY = 0;

renderer.domElement.addEventListener('mousemove', e => {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;

    if (drag) {
        rotY += dx * 0.005;
        rotX = Math.max(-1.4, Math.min(1.4, rotX - dy * 0.005));
        updateCamera();
        return;
    }
    if (rightDrag) {
        const right = new THREE.Vector3();
        camera.getWorldDirection(right);
        right.cross(camera.up).normalize();
        target.addScaledVector(right, -dx * 0.4);
        target.addScaledVector(camera.up, dy * 0.4);
        updateCamera();
        return;
    }

    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x =  ((e.clientX - rect.left)  / rect.width)  * 2 - 1;
    mouse.y = -((e.clientY - rect.top)   / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(hoverMeshes);
    if (hits.length > 0) {
        const row = rowData[hits[0].object.userData.idx];
        const missed = row.reached !== 'true';
        tooltip.style.display = 'block';
        tooltip.innerHTML =
            `<b>Point ${row.point}</b>${missed ? ' &nbsp;<span style="color:#ff4422">OUT OF REACH</span>' : ''}<br>` +
            `Commanded: (${row.cmd_x}, ${row.cmd_y}, ${row.cmd_z})<br>` +
            `Actual: (${parseFloat(row.actual_x).toFixed(1)}, ${parseFloat(row.actual_y).toFixed(1)}, ${parseFloat(row.actual_z).toFixed(1)})<br>` +
            `Delta: (${parseFloat(row.dx).toFixed(2)}, ${parseFloat(row.dy).toFixed(2)}, ${parseFloat(row.dz).toFixed(2)}) mm`;
    } else {
        tooltip.style.display = 'none';
    }
});

renderer.domElement.addEventListener('mousedown', e => {
    if (e.button === 2) rightDrag = true; else drag = true;
    lastX = e.clientX; lastY = e.clientY;
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('mouseup', () => { drag = false; rightDrag = false; });
renderer.domElement.addEventListener('wheel', e => {
    camDist = Math.max(50, camDist + e.deltaY * 0.4);
    updateCamera();
    e.preventDefault();
}, { passive: false });

window.addEventListener('resize', resize);
resize();

// ── Render loop ────────────────────────────────────────────────────────────
function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
