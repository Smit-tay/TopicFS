
# docker-compose.runtime.yml
# Runtime compose for TopicFS on the NUC.
# Usage:
#   podman-compose -f docker-compose.runtime.yml up -d
#
# Prerequisites:
#   1. colcon build completed (NF_00)
#   2. Runtime image built (see below)
#   3. Mount point directory exists: mkdir -p ~/fuse_mount
x-podman:
  in_pod: false
  
services:
  topicfs_runtime:
    image: topicfs_runtime:latest
    container_name: topicfs_runtime
    hostname: topicfs-runtime
    userns_mode: "keep-id"
    network_mode: "host"
    privileged: true
    devices:
      - /dev/fuse:/dev/fuse
    volumes:
      - /home/jack/dev/smithjack.net/topicfs/install:/home/jack/dev/smithjack.net/topicfs/install:z
      - /home/jack/fuse_mount:/home/jack/fuse_mount:z,shared
      - /opt/topicfs_typesupport:/opt/topicfs_typesupport:z
    environment:
      TZ: Europe/Berlin
      ROS_DOMAIN_ID: 11
      TOPICFS_MOUNT_POINT: /home/jack/fuse_mount
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
