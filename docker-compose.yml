services:
  topicfs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - HOST_UID=${UID:-1000}
        - HOST_GID=${GID:-1000}
        - USERNAME=${USER:-$(id -un)}
    container_name: topicfs
    hostname: topicfs-container
    userns_mode: "keep-id"
    network_mode: "host"
    privileged: true
    command: /bin/bash
    tty: true
    stdin_open: true
    volumes:
      - /home/jack/dev/smithjack.net:/home/jack/dev/smithjack.net:z
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      TZ: Europe/Berlin
      QT_X11_NO_MITSHM: 1
      DISPLAY: $DISPLAY
    cap_add:
      - SYS_NICE
